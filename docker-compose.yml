services:

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ticketdb
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  event-service:
    build: ../ticket-event-service
    container_name: event-service
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ticketdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
    ports:
      - "8081:8081"

  booking-service:
    build: ../ticket-booking-service
    container_name: booking-service
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      event-service:
        condition: service_started
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ticketdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
      EVENT_SERVICE_URL: http://event-service:8081
    ports:
      - "8082:8082"

  auth-service:
    build: ../ticket-auth-service
    container_name: auth-service
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ticketdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
    ports:
      - "8083:8083"

  frontend:
    build: ../ticket-frontend
    container_name: frontend
    restart: on-failure
    ports:
      - "80:80"

volumes:
  mysql-data:
