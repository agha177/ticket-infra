apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-service

spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-service

  template:
    metadata:
      labels:
        app: event-service
    spec:
      containers:
        - name: event-service
          image: ticket-event-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef: 
                  name: app-config
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_USERNAME      
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_PASSWORD
