apiVersion: apps/v1
kind: Deployment
metadata: 
  name: auth-service

spec:
  replicas: 1
  selector:
    matchLabels: 
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    
    spec:
      containers:
        - name: auth-service
          image: ticket-auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config  
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom: 
                configMapKeyRef:
                  name: app-config
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_PASSWORD       
